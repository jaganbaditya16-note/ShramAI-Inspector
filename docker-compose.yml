services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: shramai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shramai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/shramai
      APP_ENV: development
      AUTH_MODE: demo # set "required" + bootstrap admin credentials for shared use
      STORAGE_DIR: /app/storage
      KNOWLEDGE_DIR: /app/data/knowledge
      RATE_LIMIT_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - document_storage:/app/storage

  web:
    build:
      context: ./apps/web
      args:
        # Server-side rewrite target: the API container (never the browser).
        API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  document_storage:
